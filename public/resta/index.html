<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resta | Neon Lab</title>
<style>
:root{--accent:#f472b6;--bg:#100815;--panel:#211226;--line:#4b234b;--text:#fff1f8;--muted:#c5a9bc}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;color:var(--text);font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 85% 0,#581c45,transparent 38%),var(--bg)}.shell{width:min(850px,100%);margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.nav a{color:var(--muted);text-decoration:none}.tag{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.15em}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.panel{padding:32px;border:1px solid var(--line);border-radius:24px;background:#211226dd;box-shadow:0 25px 70px #0005}.panel h1{margin:10px 0;font-size:2.7rem}.panel p{color:var(--muted);line-height:1.6}.field{margin-top:22px}.field label{display:block;margin-bottom:8px;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.field input{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;outline:0;color:var(--text);background:#130a18;font-size:1.1rem}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f472b622}.actions{display:flex;gap:10px;margin-top:24px}.actions button{flex:1;padding:14px;border:0;border-radius:12px;color:#310a27;background:var(--accent);font-weight:800;cursor:pointer}.actions button.secondary{color:var(--text);background:#38213b}.result{min-height:115px;margin-top:20px;padding:20px;border:1px solid #f472b666;border-radius:16px;color:var(--accent);background:#f472b60d;font-size:1.25rem;font-weight:800}.result small{display:block;margin-top:9px;color:var(--muted);font-size:.78rem;font-weight:400}.history h3{margin-top:0}.history ol{padding-left:20px;color:var(--muted);line-height:2}.history button{border:0;color:var(--accent);background:none;cursor:pointer}.tip{margin-top:30px;padding:16px;border-left:3px solid var(--accent);color:var(--muted);font-size:.9rem;line-height:1.5}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{margin-bottom:30px}}
</style></head>
<body><main class="shell"><nav class="nav"><a href="../">← Neon Lab</a><span class="tag">MODULE 02 / DJANGO</span></nav><div class="layout"><section class="panel"><div class="tag">OPERACIÓN BINARIA</div><h1>Resta precisa</h1><p>Calcula diferencias positivas o negativas con una interfaz enfocada.</p><div class="field"><label for="num1">Entrada A</label><input id="num1" type="number" step="any" placeholder="0"></div><div class="field"><label for="num2">Entrada B</label><input id="num2" type="number" step="any" placeholder="0"></div><div class="actions"><button type="button" onclick="calcular()">Calcular resta</button><button class="secondary" type="button" onclick="limpiar()">Limpiar</button></div><div class="result" id="resultado" aria-live="polite">Esperando datos...<small>El resultado aparecerá aquí</small></div><div class="tip">Atajo: presiona <b>Enter</b> para calcular.</div></section><aside class="panel history"><h3>Historial local</h3><p>Se guarda solo en este navegador.</p><ol id="historial"><li>Aún no hay cálculos.</li></ol><button type="button" onclick="borrarHistorial()">Borrar historial</button></aside></div></main>
<script>
const a=document.getElementById('num1'),b=document.getElementById('num2'),r=document.getElementById('resultado'),h=document.getElementById('historial');let historial=JSON.parse(localStorage.getItem('neon-resta')||'[]');function render(){h.innerHTML=historial.length?historial.map(x=>`<li>${x}</li>`).join(''):'<li>Aún no hay cálculos.</li>'}function calcular(){if(a.value===''||b.value===''){r.innerHTML='Completa las dos entradas.<small>Necesitamos dos números para continuar.</small>';return}const v=Number(a.value)-Number(b.value);r.innerHTML=`${a.value} − ${b.value} = ${v}<small>Resultado generado en modo Django</small>`;historial.unshift(`${a.value} − ${b.value} = ${v}`);historial=historial.slice(0,5);localStorage.setItem('neon-resta',JSON.stringify(historial));render()}function limpiar(){a.value='';b.value='';r.innerHTML='Esperando datos...<small>El resultado aparecerá aquí</small>'}function borrarHistorial(){historial=[];localStorage.removeItem('neon-resta');render()}[a,b].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')calcular()}));render();
</script></body></html>
