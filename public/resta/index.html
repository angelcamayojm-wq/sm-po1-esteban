<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restas de Angel</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;color:#593529;font-family:"Trebuchet MS",Arial,sans-serif;background:#ffe0ca}.wrap{width:min(880px,100%);margin:auto}.back{display:inline-block;margin-bottom:25px;color:#80513e;font-weight:800;text-decoration:none}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.paper{padding:30px;border:2px solid #684032;border-radius:8px 22px 8px 22px;background:#fffaf3;box-shadow:8px 8px 0 #df9a73}.paper h1{margin:10px 0 8px;font-family:Georgia,serif;font-size:2.5rem}.paper p{color:#8b6253;line-height:1.55}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#ffc6a5;font-size:.78rem;font-weight:900}.field{margin-top:20px}.field label{display:block;margin-bottom:7px;font-size:.78rem;font-weight:900;text-transform:uppercase}.field input{width:100%;padding:14px;border:2px solid #edb18d;border-radius:10px;color:#593529;background:#fff3e9;font-size:1.1rem;outline:0}.field input:focus{border-color:#d9784e}.buttons{display:flex;gap:10px;margin-top:23px}.buttons button{flex:1;padding:14px;border:2px solid #593529;border-radius:10px;font-weight:900;cursor:pointer}.go{color:#fff;background:#d9784e}.clear{background:#fffaf3}.result{min-height:105px;margin-top:18px;padding:18px;border-radius:13px;background:#ffe9d9;font-size:1.25rem;font-weight:900}.result small{display:block;margin-top:9px;color:#956b5a;font-size:.8rem;font-weight:400}.history{padding:25px;border:2px dashed #d99370;border-radius:15px;background:#fff1e5}.history h3{margin-top:0;font-family:Georgia,serif}.history p{color:#956b5a;font-size:.9rem}.history ol{padding-left:22px;color:#805748;line-height:2}.history button{border:0;color:#a05d42;background:transparent;cursor:pointer;text-decoration:underline}@media(max-width:680px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><a class="back" href="../">← Volver a la mesa de trabajo</a><div class="layout"><section class="paper"><span class="badge">🍊 MODO RESTA</span><h1>Restemos juntos</h1><p>Compara dos números y encuentra la diferencia con Django.</p><div class="field"><label for="num1">Primer número</label><input id="num1" type="number" step="any" placeholder="Ej. 20"></div><div class="field"><label for="num2">Segundo número</label><input id="num2" type="number" step="any" placeholder="Ej. 7"></div><div class="buttons"><button class="go" type="button" onclick="calcular()">🍊 Restar</button><button class="clear" type="button" onclick="limpiar()">Limpiar</button></div><div class="result" id="resultado" aria-live="polite">Aquí aparecerá la respuesta.<small>Completa los dos campos para comenzar.</small></div></section><aside class="history"><h3>📒 Mis cuentas</h3><p>Se quedan guardadas en este dispositivo.</p><ol id="historial"></ol><button type="button" onclick="borrarHistorial()">Borrar notas</button></aside></div></main>
<script>const a=document.getElementById('num1'),b=document.getElementById('num2'),r=document.getElementById('resultado'),h=document.getElementById('historial');let items=JSON.parse(localStorage.getItem('angel-resta')||'[]');function pintar(){h.innerHTML=items.length?items.map(x=>`<li>${x}</li>`).join(''):'<li>Aún no hay cuentas.</li>'}function calcular(){if(a.value===''||b.value===''){r.innerHTML='🤔 Faltan números.<small>Completa los dos campos.</small>';return}const v=Number(a.value)-Number(b.value);r.innerHTML=`🎉 ${a.value} − ${b.value} = ${v}<small>Resultado listo.</small>`;items.unshift(`${a.value} − ${b.value} = ${v}`);items=items.slice(0,6);localStorage.setItem('angel-resta',JSON.stringify(items));pintar()}function limpiar(){a.value='';b.value='';r.innerHTML='Aquí aparecerá la respuesta.<small>Completa los dos campos para comenzar.</small>'}function borrarHistorial(){items=[];localStorage.removeItem('angel-resta');pintar()}[a,b].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')calcular()}));pintar();</script></body>
</html>
